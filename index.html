<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Buscador múltiples campos - JS Moderno </title>
    <link href="https://fonts.googleapis.com/css?family=Staatliches" rel="stylesheet">  
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/skeleton.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

    <header class="hero">
        <div class="hero__overlay"></div>
        <div class="hero__content">
            <p class="hero__tag">LS Automotores</p>
            <h1 class="hero__title">Buscador de Autos</h1>
            <p class="hero__subtitle">
                Filtra por marca, año, precio y más para encontrar tu próximo auto ideal.
            </p>
        </div>
    </header>

    <main class="main">
        <div class="contenedor">

            <form id="buscador" class="filter-card">
                <div id="toast" class="toast">
                    ¿Tienes alguna duda?
                    <img src="img/wp-icon.png" alt="WhatsApp" class="toast-icon">
                </div>

                <h2 class="filter-card__title">Filtrar resultados</h2>

                <div class="filters-grid">
                    <div class="filter-field">
                        <label for="marca">Marca</label>
                        <select class="u-full-width" id="marca">
                            <option value="">Seleccione</option>
                            <option value="Audi">Audi</option>
                            <option value="BMW">BMW</option>
                            <option value="Mercedes Benz">Mercedes Benz</option>
                            <option value="Chevrolet">Chevrolet</option>
                            <option value="Ford">Ford</option>
                            <option value="Dodge">Dodge</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="year">Año</label>
                        <select class="u-full-width" id="year">
                            <option value="">Seleccione</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="minimo">Precio Min</label>
                        <select class="u-full-width" id="minimo">
                            <option value="">Seleccione</option>
                            <option value="20000">20,000</option>
                            <option value="30000">30,000</option>
                            <option value="40000">40,000</option>
                            <option value="50000">50,000</option>
                            <option value="60000">60,000</option>
                            <option value="70000">70,000</option>
                            <option value="80000">80,000</option>
                            <option value="90000">90,000</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="maximo">Precio Max</label>
                        <select class="u-full-width" id="maximo">
                            <option value="">Seleccione</option>
                            <option value="20000">20,000</option>
                            <option value="30000">30,000</option>
                            <option value="40000">40,000</option>
                            <option value="50000">50,000</option>
                            <option value="60000">60,000</option>
                            <option value="70000">70,000</option>
                            <option value="80000">80,000</option>
                            <option value="90000">90,000</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="puertas">Puertas</label>
                        <select class="u-full-width" id="puertas">
                            <option value="">Seleccione</option>
                            <option value="2">2</option>
                            <option value="4">4</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="transmision">Transmisión</label>
                        <select class="u-full-width" id="transmision">
                            <option value="">Seleccione</option>
                            <option value="automatico">Automática</option>
                            <option value="manual">Manual</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="color">Color</label>
                        <select class="u-full-width" id="color">
                            <option value="">Seleccione</option>
                            <option value="Negro">Negro</option>
                            <option value="Azul">Azul</option>
                            <option value="Blanco">Blanco</option>
                            <option value="Rojo">Rojo</option>
                        </select>
                    </div>
                </div>
            </form>

            <section class="resultados">
                <h2 class="resultados__title">Resultados</h2>
                <div id="resultado" class="resultados__grid"></div>
            </section>
        </div>

        <a class="sitio-web" href="#" rel="">lsanchez.dev / LS Automotores</a>
    </main>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
